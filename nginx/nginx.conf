############################################################
#  nginx.conf  –  PRN232 eBay Buyer Load Balancer
#  Thuật toán: Round-Robin với keepalive connection pooling
############################################################

worker_processes auto;              # Tự động theo số CPU cores
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;        # Số connection tối đa mỗi worker
    use epoll;                      # Dùng epoll trên Linux (tối ưu)
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Log format (bao gồm thông tin upstream để debug LB) ──────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'upstream="$upstream_addr" '         # ← instance nào xử lý
                      'rt=$request_time '                  # ← thời gian xử lý
                      'uct="$upstream_connect_time" '
                      'urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # ── Tối ưu hiệu năng ─────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;              # Ẩn phiên bản Nginx (bảo mật)

    # ── Gzip Compression (giảm bandwidth ~70%) ────────────────────────────────
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Rate Limiting (chống DDoS / abuse) ───────────────────────────────────
    # Giới hạn 20 req/giây mỗi IP, zone 10MB (~160k IPs)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=30r/s;

    # ── Upstream Pool: 3 API Instances (Round-Robin) ─────────────────────────
    upstream api_backend {
        # Round-Robin là mặc định (có thể thay bằng least_conn;)
        least_conn;                 # Ưu tiên server ít kết nối nhất

        server api1:8080 weight=1 max_fails=3 fail_timeout=30s;
        server api2:8080 weight=1 max_fails=3 fail_timeout=30s;
        server api3:8080 weight=1 max_fails=3 fail_timeout=30s;

        # Connection pooling – tái sử dụng connection đến upstream
        keepalive 32;               # Giữ tối đa 32 idle connection
        keepalive_requests 100;     # Số request tối đa mỗi keepalive connection
        keepalive_timeout 60s;
    }

    # ── Upstream: Frontend (1 instance) ──────────────────────────────────────
    upstream frontend_backend {
        server frontend:8080;
        keepalive 8;
    }

    # ── Virtual Host: API (http://localhost/api/*) ────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ── Timeout settings ─────────────────────────────────────────────────
        proxy_connect_timeout   10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      60s;

        # ── Security Headers ──────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ── Route /api/ → API Backend Pool ───────────────────────────────────
        # QUAN TRỌNG: proxy_pass KHÔNG có trailing slash → giữ nguyên /api/ prefix
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;

            # Headers để upstream biết request thực sự từ đâu
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Keepalive connection reuse
            proxy_set_header   Connection        "";

            # Buffer settings (tối ưu cho JSON API)
            proxy_buffering    on;
            proxy_buffer_size  4k;
            proxy_buffers      8 16k;

            # Expose instance header ra client (để debug)
            add_header X-Handled-By $upstream_addr always;
        }

        # ── Route /health → health check trực tiếp không rate limit ─────────
        location /health {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            access_log off;        # Không log health check (tránh noise)
        }

        # ── Route / → Frontend ────────────────────────────────────────────────
        location / {
            limit_req zone=frontend_limit burst=60 nodelay;

            proxy_pass         http://frontend_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Status page (monitor Nginx, tắt ở production) ────────────────────
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1;
            allow 172.0.0.0/8;    # Docker network
            deny all;
        }

        # ── Custom error pages ────────────────────────────────────────────────
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
